name: Sentinel Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f dashboard/requirements.txt ]; then pip install -r dashboard/requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # Para o código Python
        flake8 dashboard/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Validate Shell Scripts
      run: |
        # Instala o ShellCheck para validar os scripts bash
        sudo apt-get install shellcheck
        shellcheck scripts/*.sh  